<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240" font-family="ui-monospace,'SFMono-Regular','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace">

<style>
.fade{animation:fade .9s ease both}
@keyframes fade{from{opacity:0}}
.blink{animation:blink 1.1s steps(2,start) infinite}
@keyframes blink{50%{opacity:0}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s ease-out infinite}
@keyframes ping{0%{transform:scale(.55);opacity:.8}100%{transform:scale(1.7);opacity:0}}
.draw{stroke-dasharray:700;animation:draw 2.4s ease both .3s}
@keyframes draw{from{stroke-dashoffset:700}to{stroke-dashoffset:0}}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 1.4s ease both .4s}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>
<text x="10" y="26" font-size="12" fill="#FF8C32" font-weight="600" text-anchor="start" letter-spacing="3" class="fade">01 — whoami</text><line x1="114.5" y1="21" x2="870" y2="21" stroke="#d0d7de" stroke-width="1"/>
<text x="30" y="78" font-size="14" fill="#FF8C32" font-weight="400" text-anchor="start">$</text>
<text x="52" y="78" font-size="14" fill="#0d1117" font-weight="600" text-anchor="start">whoami</text>
<text x="30" y="107" font-size="14" fill="#0d1117" font-weight="400" text-anchor="start">misha mahenur alam — final-year cse student, brac university</text>
<text x="30" y="132" font-size="14" fill="#57606a" font-weight="400" text-anchor="start">builds for the web, end to end. cgpa 3.77/4.00, graduating sept 2026.</text>
<text x="30" y="157" font-size="14" fill="#57606a" font-weight="400" text-anchor="start">peer-mentors dsa, web development &amp; compiler design.</text>
<text x="30" y="182" font-size="14" fill="#57606a" font-weight="400" text-anchor="start">co-authored a paper in the acm compass 2026 proceedings.</text>
<text x="30" y="211" font-size="14" fill="#0d1117" font-weight="400" text-anchor="start">always looking for the next challenge worth taking on →</text>
<rect class="blink" x="430" y="198" width="8" height="15" fill="#FF8C32"/>
</svg>
