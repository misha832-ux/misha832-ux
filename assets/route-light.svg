<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="880" height="190" font-family="ui-monospace,'SFMono-Regular','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace">

<style>
.fade{animation:fade .9s ease both}
@keyframes fade{from{opacity:0}}
.blink{animation:blink 1.1s steps(2,start) infinite}
@keyframes blink{50%{opacity:0}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s ease-out infinite}
@keyframes ping{0%{transform:scale(.55);opacity:.8}100%{transform:scale(1.7);opacity:0}}
.draw{stroke-dasharray:700;animation:draw 2.4s ease both .3s}
@keyframes draw{from{stroke-dashoffset:700}to{stroke-dashoffset:0}}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 1.4s ease both .4s}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.type{animation:type 1.8s steps(28,end) both}
@keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
</style>
<text x="10" y="26" font-size="12" fill="#1a9850" font-weight="600" text-anchor="start" letter-spacing="3" class="fade">04 — the route</text><line x1="143.0" y1="21" x2="870" y2="21" stroke="#d0d7de" stroke-width="1"/>
<line x1="60" y1="120" x2="110" y2="120" stroke="#d0d7de" stroke-width="1.5"/>
<line x1="110" y1="120" x2="840" y2="120" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 6"/>
<text x="110" y="76" font-size="13" fill="#0d1117" font-weight="600" text-anchor="middle">final-year cse student</text>
<text x="110" y="94" font-size="11" fill="#57606a" font-weight="400" text-anchor="middle">brac university</text>
<circle class="ping" cx="110" cy="120" r="10" fill="none" stroke="#1a9850" stroke-width="1"/>
<circle cx="110" cy="120" r="5" fill="#1a9850"/>
<text x="110" y="148" font-size="10" fill="#57606a" font-weight="400" text-anchor="middle">expected grad · sept 2026</text>
<text x="840" y="148" font-size="10" fill="#57606a" font-weight="400" text-anchor="end" font-style="italic" opacity="0.6">the road ahead</text>
</svg>
