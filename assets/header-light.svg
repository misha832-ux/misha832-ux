<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="880" height="190" font-family="ui-monospace,'SFMono-Regular','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace">
<defs><linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8B5CF6"/><stop offset="1" stop-color="#5B21B6"/></linearGradient></defs>
<style>
.fade{animation:fade .9s ease both}
@keyframes fade{from{opacity:0}}
.blink{animation:blink 1.1s steps(2,start) infinite}
@keyframes blink{50%{opacity:0}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s ease-out infinite}
@keyframes ping{0%{transform:scale(.55);opacity:.8}100%{transform:scale(1.7);opacity:0}}
.draw{stroke-dasharray:700;animation:draw 2.4s ease both .3s}
@keyframes draw{from{stroke-dashoffset:700}to{stroke-dashoffset:0}}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 1.4s ease both .4s}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.type{animation:type 1.8s steps(28,end) both}
@keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
</style>
<path d="M14 34 L14 14 L34 14" fill="none" stroke="#6D28D9" stroke-width="1.5"/>
<path d="M866 34 L866 14 L846 14" fill="none" stroke="#6D28D9" stroke-width="1.5"/>
<path d="M14 156 L14 176 L34 176" fill="none" stroke="#6D28D9" stroke-width="1.5"/>
<path d="M866 156 L866 176 L846 176" fill="none" stroke="#6D28D9" stroke-width="1.5"/>
<g class="type"><text x="440" y="92" font-size="34" fill="#0d1117" font-weight="700" text-anchor="middle" letter-spacing="5">misha mahenur alam</text></g>
<text x="440" y="142" font-size="13" fill="#57606a" font-weight="400" text-anchor="middle" letter-spacing="3" class="fade">misha832-ux — full-stack developer · researcher</text>
</svg>
